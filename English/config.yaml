preprocess:
  dataset: Svarah_English
  path:
    corpus_path: ''
    # Path to the downloaded Svarah raw audio + transcription files,
    # organised as raw_en/<speaker_id>/<utterance_id>.wav + .lab
    raw_path: /content/drive/MyDrive/tts_assignment/raw/english/raw_en
    # Where mel / pitch / energy / duration .npy files will be written
    preprocessed_path: /content/preprocessed_data/English
    # Combined CMU-dict + Svarah pronunciation dictionary built during data prep
    lexicon_path: /content/drive/MyDrive/tts_assignment/processed/english/en_merged.dict
    # MFA-aligned TextGrid files, one sub-folder per speaker
    aligned_path: /content/drive/MyDrive/tts_assignment/processed/english/aligned_en
    # CSV manifest with columns: utt, speaker, text, split (train / val)
    manifest_path: /content/drive/MyDrive/tts_assignment/processed/english/manifest_clean.csv
  preprocessing:
    val_size: 512
    text:
      text_cleaners:
      - basic_cleaners
      language: en
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: phoneme_level
      normalization: true
    energy:
      feature: phoneme_level
      normalization: true
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true
  max_seq_len: 1000
  vocoder:
    model: HiFi-GAN
    speaker: universal
train:
  path:
    ckpt_path: /content/drive/MyDrive/tts_assignment/checkpoints/english
    log_path: /content/drive/MyDrive/tts_assignment/results/english/log
    result_path: /content/drive/MyDrive/tts_assignment/results/english/synth
  optimizer:
    batch_size: 16
    betas:
    - 0.9
    - 0.98
    eps: 1.0e-09
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 1000
    anneal_steps:
    - 6000
    - 8000
    - 9000
    anneal_rate: 0.3
  step:
    total_step: 10000
    log_step: 50
    synth_step: 1000
    val_step: 500
    save_step: 1000
