# NOTE: This file is for English (Svarah).
# For Telugu, use config/preprocess_telugu.yaml or Telugu/config.yaml.
dataset: Svarah_English
path:
  corpus_path: ''
  raw_path: /content/drive/MyDrive/tts_assignment/raw/english/raw_en
  preprocessed_path: /content/preprocessed_data/English
  lexicon_path: /content/drive/MyDrive/tts_assignment/processed/english/en_merged.dict
  aligned_path: /content/drive/MyDrive/tts_assignment/processed/english/aligned_en
  manifest_path: /content/drive/MyDrive/tts_assignment/processed/english/manifest_clean.csv
preprocessing:
  val_size: 512
  text:
    text_cleaners:
    - basic_cleaners
    language: en
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true
