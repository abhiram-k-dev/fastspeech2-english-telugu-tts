# NOTE: This file is for Telugu (IndicTTS).
# For English, see config/preprocess.yaml or English/config.yaml.
dataset: IndicTTS_Telugu
path:
  corpus_path: ''
  raw_path: /content/drive/MyDrive/tts_assignment/raw/telugu/raw_te
  preprocessed_path: /content/preprocessed_data/Telugu
  lexicon_path: ''
  aligned_path: /content/drive/MyDrive/tts_assignment/processed/telugu/aligned_te
  manifest_path: /content/drive/MyDrive/tts_assignment/processed/telugu/manifest_clean.csv
preprocessing:
  val_size: 512
  text:
    text_cleaners:
    - basic_cleaners
    language: te
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true
